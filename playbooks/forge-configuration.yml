---
- name: Forge Configuration Management
  hosts: forge
  gather_facts: true
  become: true

  tasks:
    - name: Display system identity
      ansible.builtin.debug:
        msg:
          - "Hostname: {{ ansible_facts['hostname'] }}"
          - "OS: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"
          - "Kernel: {{ ansible_facts['kernel'] }}"
          - "Architecture: {{ ansible_facts['architecture'] }}"

    - name: Ensure managed operations directory exists
      ansible.builtin.file:
        path: "{{ forge_managed_directory }}"
        state: directory
        mode: "0755"

    - name: Install core system management packages
      ansible.builtin.dnf:
        name: "{{ forge_core_packages }}"
        state: present

    - name: Ensure firewalld service is enabled and started
      ansible.builtin.systemd:
        name: firewalld
        enabled: true
        state: started
    - name: Ensure NFS server is enabled and started
      ansible.builtin.systemd:
        name: nfs-server
        enabled: true
        state: started


    - name: Allow managed services through firewalld
      ansible.posix.firewalld:
        service: "{{ item }}"
        permanent: true
        state: enabled
        immediate: true
      loop: "{{ forge_firewall_services }}"

    - name: Display active SELinux enforcement status
      ansible.builtin.debug:
        msg: "SELinux Status: {{ ansible_facts['selinux']['status'] | default('Disabled/Not Installed') }} (Mode: {{ ansible_facts['selinux']['mode'] | default('N/A') }})"

    - name: Deploy managed operations banner
      ansible.builtin.template:
        src: ../templates/operations-banner.j2
        dest: /etc/operations-banner
        owner: root
        group: root
        mode: "0644"
      notify: Report operations banner update

    - name: Ensure NFS export directory exists
      ansible.builtin.file:
        path: "{{ forge_nfs_export }}"
        state: directory
        owner: alikhan
        group: alikhan
        mode: "0755"

    - name: Deploy NFS exports configuration
      ansible.builtin.template:
        src: ../templates/exports.j2
        dest: /etc/exports
        owner: root
        group: root
        mode: "0644"
      notify: Reload NFS exports

  handlers:
    - name: Report operations banner update
      ansible.builtin.debug:
        msg: "Operations banner configuration changed on {{ inventory_hostname }}"

    - name: Reload NFS exports
      ansible.builtin.command:
        cmd: exportfs -ra
